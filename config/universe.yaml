options_rules:
  min_dte: 14
  max_dte: 60
  target_dte: 30
  delta_target_long: 0.45
  delta_target_short: 0.25
  min_open_interest: 100
  max_bid_ask_spread_pct: 0.15 # Max 15% spread width allowed

risk_rules:
  max_risk_per_trade_pct: 0.02 # Max 2% equity at risk per trade
  max_portfolio_margin_pct: 0.50 # Max 50% capital committed
  max_open_positions: 10
  daily_max_drawdown_stop_pct: 0.04
