    - symbol: "QQQ"
      name: "Invesco QQQ Trust"
      asset_class: "US_EQUITY"
      has_options: true
    - symbol: "NVDA"
      name: "NVIDIA Corporation"
      asset_class: "US_EQUITY"
      has_options: true
    - symbol: "AAPL"
      name: "Apple Inc."
      asset_class: "US_EQUITY"
      has_options: true
    - symbol: "MSFT"
      name: "Microsoft Corporation"
      asset_class: "US_EQUITY"
      has_options: true

  commodities:
    - symbol: "GLD"
      name: "SPDR Gold Shares"
      asset_class: "COMMODITY"
      has_options: true
    - symbol: "USO"
      name: "United States Oil Fund"
      asset_class: "COMMODITY"
      has_options: true
    - symbol: "SLV"
      name: "iShares Silver Trust"
      asset_class: "COMMODITY"
